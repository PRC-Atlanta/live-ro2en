<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live RO2EN</title>
<link rel="stylesheet" href="styles/tokens.css">
</head>
<body>
<!-- No header here: every screen draws the shared toolbar itself (components/frame.js). This
     line only shows while the /ws connection is lost, or which mock scenario is running. -->
<p class="conn" id="conn" role="status" aria-live="polite" hidden></p>
<main id="screen"></main>
<script type="module">
  // ?mock=<scenario> drives the UI from mock_state.js instead of the live /ws feed
  import { createStore } from "./core/store.js";
  import { connect, REMOTE } from "./core/api.js";
  import { startRouter } from "./core/router.js";

  const mock = new URLSearchParams(location.search).get("mock");
  const store = createStore(mock === null ? { offline: true } : {});   // nothing is known before /ws answers
  const conn = document.getElementById("conn");
  if (mock !== null) {
    const { startMock } = await import("./mock_state.js");
    startMock(store, mock || "live");
    conn.textContent = `Practice data: ${mock || "live"}`;
    conn.dataset.kind = "mock";
    conn.hidden = false;
  } else {
    let seen = false;                      // say nothing while the first connection opens
    connect(store, ok => {
      seen ||= ok;
      if (!ok) store.set({ ...store.get(), offline: true });   // the last state is stale now
      conn.textContent = ok ? "" : "Lost contact with the app. Trying again…";
      conn.hidden = ok || !seen;
    });
    setTimeout(() => { if (!seen) { conn.textContent = "Connecting to the app…"; conn.hidden = false; } }, 3000);
  }
  if (REMOTE) {             // Live Remote's full view: the Live screen alone, its window fitted to the console
    document.body.classList.add("remote");
    const tell = window.webkit?.messageHandlers?.size;
    const main = document.getElementById("screen");
    if (tell) new ResizeObserver(() => {
      const u = main.querySelector(".unit");
      if (u && u.offsetHeight) tell.postMessage({ w: u.offsetWidth, h: u.offsetHeight });
    }).observe(main);
  }
  startRouter(document.getElementById("screen"), store, { only: REMOTE ? "live" : null });
</script>
</body>
</html>
