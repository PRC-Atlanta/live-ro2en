<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captions · Live RO2EN</title>
<!-- The captions display (src/live/display.py): only the caption box, for a second screen,
     a projector, or (display.network) another device on the local network. Self-contained:
     the view-only network server serves this one file and its /ws feed. Follows the
     operator like ProPresenter would: Hide and Blank clear it, Hold keeps the held caption. -->
<style>
  :root { --fg: #ffffff; --bg: #000000; --size: 5.2vw; color-scheme: dark; }
  :root[data-colors="yellow_on_black"] { --fg: #ffe14d; --bg: #000000; }
  :root[data-colors="black_on_white"] { --fg: #000000; --bg: #ffffff; color-scheme: light; }
  :root[data-size="medium"] { --size: 4.2vw; }
  :root[data-size="x-large"] { --size: 6.6vw; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font: 600 var(--size)/1.25 -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
         display: flex; align-items: flex-end; justify-content: center; cursor: default; }
  body.idle { cursor: none; }
  #text { box-sizing: border-box; width: 100%; padding: 0 6vw 8vh; text-align: center; white-space: pre; }
  #hint { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 18px;
          font: 500 14px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.8); background: rgba(128,128,128,.28);
          transition: opacity .6s; white-space: nowrap; }
  #hint.gone { opacity: 0; }
  #dot { position: fixed; right: 14px; bottom: 12px; width: 10px; height: 10px; border-radius: 50%; background: #f5b83d; }
  #dot[hidden] { display: none; }
</style>
</head>
<body>
<div id="text" aria-live="off"></div>
<div id="hint">Double-click for full screen · Esc to leave it</div>
<div id="dot" hidden title="Lost contact with the app; trying again"></div>
<script>
(() => {
  const root = document.documentElement, text = document.getElementById("text");
  const hint = document.getElementById("hint"), dot = document.getElementById("dot");
  let shown = "", heldText = null, lostTimer = 0;

  // This window lays out its own lines. The caption box breaks lines at ProPresenter's length
  // (42 characters), but at this window's font size fewer fit, so the browser broke them again
  // and left a word like "the" alone on a line. Here the words are measured in the window's own
  // font and width; new words extend the last line, finished lines never change (so the roll-up
  // below still works), and anything that is not "more words" (Remove last, Fix last, Blank, a
  // resize) is laid out afresh.
  const words = t => (t || "").split(/\s+/).filter(Boolean);
  const ctx = document.createElement("canvas").getContext("2d");
  let lines = [], fed = [], fitW = 0, fitFont = "";
  function room() {
    const cs = getComputedStyle(text);
    const font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const w = (text.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) * 0.97;
    if (font !== fitFont || Math.abs(w - fitW) > 1) { fitFont = font; fitW = w; ctx.font = font; return true; }
    return false;
  }
  function extend(ws) {
    for (const w of ws) {
      const last = lines.length ? lines[lines.length - 1] : null;
      if (last !== null && ctx.measureText(last + " " + w).width <= fitW) lines[lines.length - 1] = last + " " + w;
      else lines.push(w);
    }
    if (lines.length > 12) lines = lines.slice(-12);
  }
  function follow(t) {
    const now = words(t);
    let start = -1;
    if (room()) start = -1;                                  // new size or width: lay out again
    else if (now.length >= fed.length && fed.every((w, i) => w === now[i])) start = fed.length;   // more words
    else {                                                   // the box dropped lines from the top
      const least = Math.min(3, fed.length, now.length);    // a lone shared word ("the") is no overlap
      for (let k = Math.min(fed.length, now.length); k >= least && k > 0; k--) {
        if (fed.slice(-k).every((w, i) => w === now[i])) { start = k; break; }
      }
    }
    if (start < 0) { lines = []; extend(now); } else extend(now.slice(start));
    fed = now;
  }
  const lastLines = n => lines.slice(-n).join("\n");

  let lastState = null;
  window.addEventListener("resize", () => { if (lastState) render(lastState); });
  function render(s) {
    lastState = s;
    const d = s.display || {};
    root.dataset.size = d.size || "large";
    root.dataset.colors = d.colors || "white_on_black";
    const hidden = s.paused && !d.show_hidden;  // show_hidden: Hide is ProPresenter's only
    follow(hidden ? "" : s.screen || "");
    let want = hidden ? "" : lastLines(Math.max(1, Math.min(3, d.lines || 2)));
    if (s.held && !hidden) {                 // Hold: the screen keeps what it had
      if (heldText === null) heldText = shown;
      want = heldText;
    } else {
      heldText = null;
    }
    if (want !== shown) paint(want);
  }

  // Roll-up: when lines leave the top, the text slides up over 250 ms instead of jumping
  // (the leaving lines fade); words appended to the last line just appear. Anything else
  // (Hide, Blank, Hold released, Remove last...) is shown at once, as is everything when
  // the viewer asks for reduced motion.
  const still = window.matchMedia("(prefers-reduced-motion: reduce)");
  let rollTimer = 0;
  const lineDivs = ls => ls.map(l => { const d = document.createElement("div"); d.textContent = l; return d; });
  function settle(want) {
    clearTimeout(rollTimer); rollTimer = 0;
    text.style.transition = text.style.transform = "";
    text.replaceChildren(...lineDivs(want ? want.split("\n") : []));
  }
  function paint(want) {
    const before = shown.split("\n").filter(Boolean), after = want.split("\n").filter(Boolean);
    shown = want;
    // k lines rolled off: the new first line continues what was line k (it may have grown)
    let k = 0;
    if (after.length && !after[0].startsWith(before[0] || "\u0000")) {
      k = before.findIndex((l, i) => i > 0 && after[0].startsWith(l));
    }
    if (k <= 0 || still.matches || document.hidden) return settle(want);
    settle(before.slice(0, k).concat(after).join("\n"));
    const leaving = [...text.children].slice(0, k);
    const h = leaving.reduce((sum, d) => sum + d.offsetHeight, 0);
    text.style.transform = `translateY(${h}px)`;            // where the old lines were
    void text.offsetHeight;                                 // start from there...
    text.style.transition = "transform .25s ease-out";
    text.style.transform = "translateY(0)";                 // ...and slide up
    leaving.forEach(d => { d.style.transition = "opacity .25s"; d.style.opacity = "0"; });
    rollTimer = setTimeout(() => settle(want), 280);
  }

  function connect() {
    const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
    ws.onopen = () => { clearTimeout(lostTimer); lostTimer = 0; dot.hidden = true; };
    ws.onmessage = e => { try { render(JSON.parse(e.data)); } catch { /* not for us */ } };
    ws.onclose = () => {
      dot.hidden = false;
      // a stale caption must not stay up for long: 5 s from the first drop, whatever the
      // retries (each failed one closes again; they must not restart the countdown)
      if (!lostTimer) lostTimer = setTimeout(() => { shown = ""; heldText = null; lines = []; fed = []; settle(""); }, 5000);
      setTimeout(connect, 1000);
    };
  }
  connect();

  // full screen: the Mac app's window (webkit message) or the browser's own
  const app = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.display;
  function toggleFull() {
    if (app) return app.postMessage("toggleFullScreen");
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  document.addEventListener("dblclick", toggleFull);
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (app) app.postMessage("exitFullScreen");
    else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  });

  // the hint and the pointer fade after 3 s of no mouse movement
  let idle = 0;
  function wake() {
    hint.classList.remove("gone"); document.body.classList.remove("idle");
    clearTimeout(idle);
    idle = setTimeout(() => { hint.classList.add("gone"); document.body.classList.add("idle"); }, 3000);
  }
  document.addEventListener("mousemove", wake);
  wake();
})();
</script>
</body>
</html>
