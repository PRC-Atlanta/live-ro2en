<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Translation</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1b; --mute:#6b6b66; --line:#e2e2dc;
          --go:#1f7a4d; --stop:#b3261e; --accent:#2f5aa8; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --panel:#1e1e1c; --ink:#ecece8;
          --mute:#9b9b94; --line:#33332f; --go:#3fa36e; --stop:#e0574d; --accent:#6f98e6; --warn:#d6a13a; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 16px;
           border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; }
  h1 { font-size:17px; margin:0 12px 0 0; }
  button, select { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line);
                   background:var(--panel); color:var(--ink); cursor:pointer; }
  button.go { background:var(--go); color:#fff; border-color:var(--go); }
  button.stop { background:var(--stop); color:#fff; border-color:var(--stop); }
  .seg button { border-radius:0; margin-left:-1px; }
  .seg button:first-child { border-radius:8px 0 0 8px; } .seg button:last-child { border-radius:0 8px 8px 0; }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns: 1fr; max-width:1200px; margin:0 auto; }
  .stats { display:flex; gap:24px; flex-wrap:wrap; }
  .stat b { display:block; font-size:28px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--mute); font-size:13px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .screen { white-space:pre-wrap; font-size:22px; min-height:2.9em; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; width:47%; }
  td.l { width:6%; color:var(--mute); font-variant-numeric:tabular-nums; text-align:right; }
  .mute { color:var(--mute); } .err { color:var(--stop); white-space:pre-line; } .partial { color:var(--mute); font-style:italic; }
  @media (max-width:700px) { td { display:block; width:100%; } td.l { text-align:left; } }
</style>
</head>
<body>
<header>
  <h1>Live Translation</h1>
  <button id="start" class="go">Start</button>
  <button id="stop" class="stop">Stop</button>
  <span class="seg" id="modes">
    <button data-mode="auto">Auto</button><button data-mode="ro-en">RO → EN</button><button data-mode="en-ro">EN → RO</button>
  </span>
  <span class="seg" id="profiles" title="Fast: ~1.5 s after each phrase. Quality: whole sentences, better translation, ~3-5 s.">
    <button data-profile="fast">Fast</button><button data-profile="quality">Quality</button>
  </span>
  <select id="device" title="Audio input"><option value="">Default input</option></select>
  <button id="clear">Clear screen</button>
</header>
<main>
  <div class="card stats">
    <div class="stat"><b id="lat">–</b><span>latency, last clause (s)</span></div>
    <div class="stat"><b id="latm">–</b><span>median, last 30 (s)</span></div>
    <div class="stat"><b id="lang">–</b><span>detected language</span></div>
    <div class="stat"><b id="status" style="font-size:17px">–</b><span id="models">status</span></div>
  </div>
  <div class="card"><div class="mute">On screen</div><div class="screen" id="screen"></div>
    <div class="err" id="pperr"></div></div>
  <div class="card"><div class="partial" id="partial"></div>
    <table><tbody id="lines"></tbody></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const post = (a, b) => fetch('/api/' + a, {method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify(b || {})}).then(r => r.json()).then(render);
$('start').onclick = () => post('start', {device: $('device').value || null});
$('stop').onclick = () => post('stop');
$('clear').onclick = () => post('clear');
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => post('mode', {mode: b.dataset.mode}));
document.querySelectorAll('#profiles button').forEach(b => b.onclick = () => {
  $('status').textContent = 'switching to ' + b.dataset.profile + '…'; post('profile', {profile: b.dataset.profile}); });
fetch('/api/devices').then(r => r.json()).then(ds => (ds || []).forEach(d => {
  const o = document.createElement('option'); o.value = d.index; o.textContent = d.name; $('device').append(o); }));
const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(s) {
  $('lat').textContent = s.latency_last ?? '–';
  $('latm').textContent = s.latency_median ?? '–';
  $('lang').textContent = (s.lang || '').toUpperCase();
  $('status').textContent = s.status;
  $('models').textContent = (s.stt || '') + ' · ' + (s.translator || '').split('/').pop();
  $('screen').textContent = s.screen || '';
  const c = s.counts || {}, failed = (c.error || 0) + (c.empty_stt || 0) + (c.empty_mt || 0);
  $('pperr').textContent = [s.pp_error ? 'ProPresenter: ' + s.pp_error : '',
    ...(s.warnings || []).map(w => 'Warning: ' + w),
    failed ? `Chunks without a caption: ${failed} (error ${c.error || 0}, no speech text ${c.empty_stt || 0}, ` +
             `no translation ${c.empty_mt || 0}) of ${failed + (c.ok || 0)}` : ''].filter(Boolean).join('\n');
  $('partial').textContent = s.partial ? '… ' + s.partial : '';
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === s.mode));
  document.querySelectorAll('#profiles button').forEach(b => b.classList.toggle('on', b.dataset.profile === s.profile));
  $('start').disabled = s.running; $('stop').disabled = !s.running;
  $('lines').innerHTML = s.lines.slice().reverse().map(l =>
    `<tr><td>${esc(l.src)}</td><td>${esc(l.dst)}</td><td class="l">${l.lat.toFixed(2)}s</td></tr>`).join('');
}
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 1000);
}
connect();
</script>
</body>
</html>
