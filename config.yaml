# All non-secret settings. Secrets live only in .env.
paths:
  audio_dir: Audio
  bible_audio_dir: BibleAudio
  bible_ref_parquet: data/ref/cornilescu/data/data.parquet
  terms: terms.txt
  glossary: glossary.csv
  work: work
  logs: logs
  transcripts: transcripts

google:            # dev-only reference transcription; never used by the live app
  location_default: us-central1
  model: chirp_2
  language_codes: ["ro-RO"]
  strategy: DYNAMIC_BATCHING   # falls back to standard batch if rejected
  usage_cap_minutes: 600
  input_prefix: input/
  output_prefix: output/
  poll_initial_s: 30
  poll_max_s: 900
  poll_timeout_h: 30
  max_file_minutes: 19          # BatchRecognize rejects files > 20 min; longer ones are split at a pause
  max_files_per_request: 5      # API limit: "Number of files is restricted to 5"
  phrase_boost: 10
  model_locations: {chirp_2: europe-west4, chirp_3: us}   # overrides GOOGLE_STT_LOCATION per model
  no_adaptation_models: [chirp_3]   # chirp_3 + adaptation + word offsets -> 404 (see DECISIONS.md)

bible_testset:
  # book file stem -> list of [start_s, length_s]; cut points snap to silence gaps
  excerpts:
    01-Gen: [[0, 240]]
    19-Ps: [[6000, 240]]
    40-Mat: [[3000, 240]]
    43-Ioan: [[1200, 240, "43-Ioan_01"]]   # _00 at 4200 s ran into ch. 11, missing from the reference
    49-Efes: [[300, 180]]
    59-Iac: [[200, 180]]
    60-1Pet: [[400, 180]]
    66-Apoc: [[2400, 300]]
  max_segment_s: 20
  min_silence_s: 0.25

live:
  input_device: null          # null = system default; name or index
  input_gain_db: 0            # input gain in dB (-12..+30), the fader on the control page
  input_gain_auto: false      # automatic gain: level each speaker toward input_gain_target_db
  input_gain_target_db: -20   # its target speech level, dBFS (-30..-10, the meter's good band)
  language_mode: auto         # auto | ro-en | en-ro
  vad_threshold: 0.5
  min_pause_ms: 350           # pause that may close a clause
  max_clause_s: 7.0           # force a commit if no pause arrives
  hold_min_words: 4           # shorter fragments (except ?/!) wait for the next clause...
  hold_s: 1.2                 # ...for at most this long
  phrase_min_words: 0         # phrases with fewer words wait for the next one (slow speakers; 0 = off)...
  hold_dangling: true         # ...as do phrases ending on din/de/la/și/că/of/to/and... ("aduc condoleanțe din.")...
  hold_slow_s: 6.5            # ...for at most this long (the next phrase takes ~4-6 s to come)...
  hold_max_s: 10.0            # ...and merged up to this span (max_chunk_s caps the short-fragment hold)
  overlap_trim: true          # drop the start of an English chunk that repeats the end of the one before
  song_detect: false          # hold captions by themselves while a song is sung (loud, steady, slow, repeated lines)
  song_symbol: "♪"            # what the big screen shows during a song ("" = nothing)
  sentence_pause_s: 1.0       # a chunk's final period is shown only if the next one starts after this long a pause
  caption_min_line_s: 2.5     # a caption line stays up at least this long before it scrolls off (0 = no pacing)
  caption_reveal: true        # a long phrase's words go up a few at a time over its speaking time, not in one jump
  caption_reveal_wps: 3       # ...at about this many words a second (faster when the phrase is long for its time)
  partial_every_s: 0           # >0 shows interim text on the control page (adds load)
  stt_model: jackrabbit-ctc-lm-b8          # Jackrabbit CTC + 4-gram LM, beam 8 (see BENCHMARK.md)
  stt_venv: .venv-nemo
  translator: "nllb:nllb-200-distilled-1.3B"   # meets the 2 s target; quality option: "mlx:mlx-community/gemma-4-12B-it-qat-4bit"
                              # a profile may add translator_en_ro: another translator for English → Romanian
  profile: quality            # fast | quality (switchable on the control page)
  context_s: 6.0              # each short chunk is recognised with the previous 6 s of audio (halves errors)
  lookahead_words: 0          # look-ahead (hold last word at mid-speech cuts): tested, breaks the 6 s ceiling for RO, no RO gain
  en_recognizer: parakeet     # English speech (EN→RO): parakeet | parakeet-stream | whistle  — A/B switch
  context_clauses: 2          # previous commits shown to an LLM translator as context
  audio_watchdog_s: 2.0       # no frames from the input device this long -> NO AUDIO alert
  digital_silence_s: 10.0     # exact zeros this long (muted/dead interface) -> NO AUDIO alert
  lag_warn_s: 6.0             # a caption later than this after the speech -> CAPTIONS BEHIND alert
  catchup_max_words: 60       # when behind, waiting clauses are merged (up to this) into one translation
  stt_backlog_s: 3.0          # audio recognised this long after capture -> RECOGNITION BEHIND alert + catch-up
  catchup_max_s: 20.0         # while catching up, pauses are bridged into calls of up to this much audio
  web_host: 127.0.0.1
  web_port: 8765
  web_allowed_hosts: []       # extra host names for the control page (only if web_host is not loopback)
  transcript_log_dir: logs/services
  preload: true               # load the models at launch and keep them warm, so Start is instant
  engine_restarts: 2          # automatic speech-engine restarts per 10 minutes, then the operator decides
  keep_both_translators: auto # auto = keep Fast's and Best's translators loaded when the Mac has >= 24 GB
  mt_max_ratio: 3.0           # safety: drop a translation this many times longer than the speech...
  mt_ratio_min_words: 8       # ...once it has at least this many words (mt_overlong)
  translator_keepalive_s: 60  # translate a word on an idle translator this often, so macOS keeps it in memory (0 = off)
  mt_loop_repeats: 4          # safety: cut a phrase the translator repeats this often in one answer
  gate_min_real: 0.6          # confidence gate: a phrase with fewer real words than this share is not translated (0 = off)

# Profiles override the `live` settings above. fast = lowest delay (~1.5 s after each phrase);
# quality = whole sentences, stronger decoding, LLM translation (~3-5 s budget).
# English streaming (EN→RO locked): chunk_s / vad_threshold / pause_s / max_chunk_s below apply to
# both streaming recognizers (whistle, parakeet-stream). Cactus Whistle — English only. Fully offline: telemetry off,
# engine + weights vendored in models/whistle (fetched once by setup.sh).
whistle:
  weights: models/whistle/whistle.cact      # depth "full" (the shipped model)
  lib: models/whistle/libneedle.dylib
  depth: full                 # decoder depth; other depths need a .cact built with
  weights_by_depth: {}        #   `needle whistle build --layers N` (2..8), e.g. {4: models/whistle/whistle-d4.cact}
  keywords_file: keywords_en.txt
  stream: true                # EN→RO locked: stream and send only committed words
  chunk_s: 0.5                # audio per streaming pass: 0.5 s commits ~1.3 s sooner than 1.0 s and was more accurate
  vad_threshold: 0.6          # frames below this VAD score (music, choir) are sent as silence
  pause_s: 0.35               # gap between committed words that closes a clause
  max_chunk_s: 2.5            # longest clause (keeps the first word within the 6 s ceiling)

# Parakeet streaming English recognizer (live.en_recognizer: parakeet-stream)
parakeet_stream:
  context_size: [256, 256]    # left/right attention context (frames)
  depth: 1

# Preferred spellings applied to every transcript the system shows or translates
# (live captions, translator input, correction-tool starting text). variant: preferred
spellings:
  Filadelfia: Philadelphia
  Filadelfiei: Philadelphiei
  Iisus: Isus
  Iisuse: Isuse
  Iisusului: Isusului

profiles:
  fast:                       # NLLB: lowest delay (98% of first words <= 6 s) but translates STT slips literally
    stt_model: jackrabbit-ctc-lm-b8
    translator: "nllb:nllb-200-distilled-1.3B"
    # translator: "mlx:mlx-community/gemma-4-12B-it-qat-4bit"   # idea 1: Gemma on the short phrases (bench first)
    context_clauses: 4        # with Gemma: the previous 4 short phrases as context (NLLB has none)
    min_pause_ms: 250
    max_clause_s: 3.0
    max_chunk_s: 3.5
    min_commit_s: 2.0         # at least 2 s of speech per phrase: fewer 2-3 word scraps (~0.5 s later)
    max_commit_s: 3.5
  quality:                    # default: Gemma 4 repairs STT slips; 3.5-5.5 s phrases read as sentences
    stt_model: jackrabbit-ctc-lm-b8
    translator: "mlx:mlx-community/gemma-4-12B-it-qat-4bit"
    # translator_en_ro: "nllb:nllb-200-distilled-1.3B"   # idea 13: English → Romanian with NLLB (bench first)
    min_pause_ms: 250
    max_clause_s: 5.5         # cut long phrases at the quietest point after 5.5 s of speech
    max_chunk_s: 5.5          # and never merge fragments beyond that span
    min_commit_s: 3.5         # keep listening across short pauses until 3.5 s of audio: whole phrases, not
    max_commit_s: 5.5         #   2-3 word fragments, reach the translator (first word ~6.5-7 s; 5-7 s was ~8.5 s)
    hold_min_words: 4
    phrase_min_words: 6       # at least 6 words per translation: slow speakers' 3-word pieces wait (+~1 s average delay)
    context_clauses: 4        # Gemma sees the previous 4 chunks, so short chunks still read as sentences

propresenter:
  enabled: true               # false: captions stay in the app and the captions display (nothing is sent)
  host: 127.0.0.1
  port: 50001
  message_id: "Live Translation"
  token_name: "Text"
  max_chars_per_line: 42
  max_lines: 2
  stage_message: false
  timeout_s: 1.5
  health_every_s: 5           # check ProPresenter this often and put the caption back after an outage (0 = off)

# The captions display: a captions-only window for a second screen or projector (toolbar →
# Captions display); with `network: true` also a view-only page for other devices on the
# local network at http://<this Mac>.local:<port>/ (no controls there).
display:
  size: large                 # medium | large | x-large
  lines: 2                    # the newest lines of the caption box shown (1-3)
  colors: white_on_black      # white_on_black | yellow_on_black | black_on_white
  network: false
  port: 8766

# Words or phrases that never reach the screen (any case, diacritics optional)
safety:
  blocklist: []
